<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Technology Vocab Test 1 Revision</title>
<style>
  :root{
    --bg: #ffffff;
    --text-main: #000000;
    --text-sub: #333333;
    --text-muted: #666666;
    --border: #000000;
    --border-light: #cccccc;
    --bg-light: #f5f5f5;
    --correct-bg: #000000;
    --correct-text: #ffffff;
    --wrong-bg: #e0e0e0;
    --wrong-text: #000000;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text-main);
    font-family:"Segoe UI","PingFang HK","Microsoft JhengHei",system-ui,sans-serif;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:16px;
  }
  .wrap{width:100%;max-width:800px;}
  .card{
    background:#ffffff;
    border:2px solid var(--border);
    border-radius:8px;
    padding:30px 26px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
  }
  .hidden{display:none !important;}

  /* ---------- 開始畫面 ---------- */
  #startScreen h1{font-size:1.8rem;letter-spacing:1px;color:var(--text-main);margin-bottom:12px;text-align:center;font-weight:800;}
  #startScreen .sub{text-align:center;color:var(--text-muted);font-size:.95rem;margin-bottom:24px;letter-spacing:.5px;font-weight:600;}
  .rulebox{
    border:2px solid var(--border);
    border-radius:8px;
    padding:18px 20px;
    margin-bottom:24px;
    background:var(--bg-light);
    font-size:.95rem;
    line-height:1.8;
    color:var(--text-main);
  }
  .rulebox b{color:var(--text-main);font-weight:800;}
  .bigbtn{
    display:block;width:100%;
    padding:16px;
    background:#ffffff;
    border:2px solid var(--border);
    border-radius:8px;
    color:var(--text-main);
    font-size:1.1rem;
    letter-spacing:1px;
    cursor:pointer;
    transition:.18s;
    font-family:inherit;
    font-weight:700;
  }
  .bigbtn:hover{background:var(--text-main);color:#ffffff;}

  /* ---------- 遊戲畫面 ---------- */
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:.95rem;color:var(--text-sub);letter-spacing:.5px;font-weight:600;}
  .topbar .score{color:var(--text-main);font-weight:800;}

  .timer-row{display:flex;align-items:center;gap:12px;margin-bottom:24px;}
  .timer-track{flex:1;height:10px;background:#ffffff;border:2px solid var(--border);border-radius:99px;overflow:hidden;}
  .timer-fill{height:100%;width:100%;background:var(--text-main);border-radius:99px;transition:width 0.1s linear;}
  .timer-text{font-size:1rem;min-width:45px;text-align:right;color:var(--text-main);font-variant-numeric:tabular-nums;font-weight:800;}
  .limit-tag{font-size:.85rem;color:var(--text-sub);white-space:nowrap;font-weight:600;}

  .qtext{
    font-size:1.25rem;
    line-height:1.7;
    color:var(--text-main);
    margin-bottom:12px;
    font-weight:600;
  }
  
  .q-translation {
    font-size:1.05rem;
    color:var(--text-muted);
    margin-bottom:24px;
    font-weight:500;
    padding-bottom: 12px;
    border-bottom: 1px dashed var(--border-light);
  }

  .options{display:flex;flex-direction:column;gap:12px;}
  .option{
    display:flex;align-items:center;gap:14px;
    width:100%;padding:14px 16px;
    background:#ffffff;
    border:2px solid var(--border-light);
    border-radius:8px;
    color:var(--text-main);
    font-size:1.05rem;
    font-family:inherit;
    font-weight:600;
    cursor:pointer;
    text-align:left;
    transition:.15s;
  }
  .option:hover:not(.disabled){background:var(--text-main);color:#ffffff;border-color:var(--text-main);}
  .option:hover:not(.disabled) .letter{background:#ffffff;color:var(--text-main);border-color:#ffffff;}
  
  .option .letter{
    display:inline-flex;align-items:center;justify-content:center;
    width:28px;height:28px;flex:0 0 28px;
    border-radius:50%;
    background:var(--bg-light);
    border:2px solid var(--border-light);
    font-size:.85rem;
    color:var(--text-main);
    font-weight:800;
  }
  .option.disabled{cursor:default;}
  
  .option.correct{background:var(--correct-bg);border-color:var(--border);color:var(--correct-text);}
  .option.correct .letter{background:#ffffff;border-color:#ffffff;color:#000000;}
  
  .option.wrong{background:var(--wrong-bg);border-color:var(--border);border-width:3px;color:var(--wrong-text);}
  .option.wrong .letter{background:#ffffff;border-color:#000000;color:#000000;}

  /* ---------- 回饋 ---------- */
  .feedback{
    margin-top:24px;
    border-radius:8px;
    padding:18px 20px;
    font-size:.98rem;
    line-height:1.8;
    animation:fadeIn .25s ease;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  
  .fb-correct{background:var(--correct-bg);border:2px solid var(--border);color:var(--correct-text);}
  .fb-wrong{background:#ffffff;border:3px solid var(--border);color:var(--text-main);}
  
  .fb-title{font-size:1.1rem;font-weight:800;margin-bottom:10px;letter-spacing:.5px;}
  .fb-body b{color:inherit;font-weight:800;}
  .ansrow{margin-bottom:12px;font-weight:700;}

  #nextBtn{
    margin-top:20px;width:100%;padding:16px;
    background:#ffffff;border:2px solid var(--border);border-radius:8px;
    color:var(--text-main);font-size:1.05rem;font-family:inherit;font-weight:800;
    cursor:pointer;letter-spacing:1px;transition:.18s;
  }
  #nextBtn:hover{background:var(--text-main);color:#ffffff;}

  /* ---------- 結束畫面 ---------- */
  #endScreen{text-align:center;}
  #endScreen h2{font-size:1.6rem;color:var(--text-main);margin-bottom:20px;letter-spacing:1px;font-weight:800;}
  .finalscore{font-size:3.5rem;color:var(--text-main);letter-spacing:2px;margin-bottom:8px;font-weight:800;}
  .finalpct{font-size:1.2rem;color:var(--text-sub);margin-bottom:24px;font-weight:700;}
  #finalMsg{font-size:1rem;line-height:1.8;color:var(--text-main);margin-bottom:30px;font-weight:600;}

  .summary-notes{
    text-align:left;
    background:#ffffff;
    border:2px solid var(--border);
    border-radius:8px;
    padding:22px;
    margin-bottom:30px;
    max-height:420px;
    overflow-y:auto;
  }
  .summary-notes h3{color:var(--text-main);font-size:1.15rem;margin-bottom:16px;border-bottom:3px solid var(--border);padding-bottom:10px;letter-spacing:1px;font-weight:800;}
  .note-item{
    background:var(--bg-light);
    border-left:6px solid var(--border);
    padding:14px 16px;
    border-radius:0 6px 6px 0;
    margin-bottom:14px;
    font-size:.92rem;
    line-height:1.7;
    color:var(--text-main);
  }
  .note-item .ntag{display:block;color:var(--text-main);font-size:.85rem;margin-bottom:8px;letter-spacing:0.5px;font-weight:800;text-transform:uppercase;}
  .note-item b{color:var(--text-main);font-weight:800;}

  @media(max-width:520px){
    .card{padding:20px 16px; border-width: 1px;}
    .qtext{font-size:1.15rem;}
    #startScreen h1{font-size:1.5rem;}
    .finalscore{font-size:2.5rem;}
    .option{font-size:1rem;}
  }
</style>
</head>
<body>
<div class="wrap">

  <section id="startScreen" class="card">
    <h1>💻 Technology Vocab 溫習</h1>
    <p class="sub">Vocab Test 1 (Application, Convenience, Biotechnology, Devices)</p>
    <div class="rulebox">
      這是一個為你準備的溫習遊戲：<br>
      • 每題都有<b>中文翻譯</b>，幫你理解句子。<br>
      • 答錯會有<b>詳細中文解釋</b>，話你知點解。<br>
      • 句子會慢慢變長，<b>時間亦會自動調整</b>（20秒 ➔ 30秒）。<br>
      • 測驗結束後有<b>錯題總結</b>，方便你重點重溫。<br><br>
      📝 共 <b>22 題</b>｜選擇題格式
    </div>
    <button class="bigbtn" onclick="startGame()">開始溫習 ▶</button>
  </section>

  <section id="gameScreen" class="card hidden">
    <div class="topbar">
      <span id="progress">第 1 / 22 題</span>
      <span class="score" id="score">得分：0</span>
    </div>

    <div class="timer-row">
      <div class="timer-track"><div class="timer-fill" id="timerBar"></div></div>
      <div class="timer-text" id="timerText">20s</div>
      <div class="limit-tag" id="limitTag">限時 20 秒</div>
    </div>

    <div id="questionText" class="qtext"></div>
    <div id="translationText" class="q-translation"></div>

    <div id="options" class="options"></div>

    <div id="feedback" class="feedback hidden"></div>

    <button id="nextBtn" class="hidden" onclick="nextQuestion()">下一題 →</button>
  </section>

  <section id="endScreen" class="card hidden">
    <h2>溫習完成！</h2>
    <div class="finalscore" id="finalScore">0 / 22</div>
    <div class="finalpct" id="finalPct">0%</div>
    
    <div id="finalMsg"></div>

    <div id="summaryNotes" class="summary-notes hidden">
      <h3>📝 錯題重點溫習 (Summary Notes)</h3>
      <div id="notesList"></div>
    </div>

    <button class="bigbtn" onclick="startGame()">再溫習一次 ↻</button>
  </section>

</div>

<script>
/* ============================================================
   題庫：22 題 (Vocab Test 1)
   答案位置已完全打散，包含中文翻譯及解釋。
   ============================================================ */
const QUESTIONS = [
  /* ---------- Q1-Q11: 20 秒 (Application & Convenience) ---------- */
  {
    text: "This shop offers both expensive gaming PCs as well as ___ consoles for people on a budget.",
    zh: "這家店既提供昂貴的遊戲電腦，也為預算有限的顧客提供低成本的遊戲機。",
    options: ["low-cost", "high-end", "portable", "accurate"], 
    answer: 0,
    explain: "正確答案：<b>low-cost (低成本的)</b>。<br>句子提到 people on a budget（預算有限的人），所以應該是便宜的、低成本的。"
  },
  {
    text: "They also have ___ devices to take with you on the go.",
    zh: "他們也有方便隨身攜帶的便攜式設備。",
    options: ["waterproof", "portable", "real time", "low-cost"], 
    answer: 1,
    explain: "正確答案：<b>portable (便攜的)</b>。<br>take with you on the go (隨身攜帶) 提示了設備是輕便、容易帶走的。"
  },
  {
    text: "With the card scanner, customers can use this quick ___ that is both safe and convenient.",
    zh: "有了讀卡機，顧客可以使用這種既安全又方便的快速付款方式。",
    options: ["hoverboard", "chatbot", "payment method", "translation"], 
    answer: 2,
    explain: "正確答案：<b>payment method (付款方式)</b>。<br>讀卡機對應的是付款。選項中只有 payment method 是付款方式。"
  },
  {
    text: "With the card scanner, customers can use this quick payment method that is both safe and ___.",
    zh: "有了讀卡機，顧客可以使用這種既安全又方便的快速付款方式。",
    options: ["suspicious", "convenient", "accurate", "real time"], 
    answer: 1,
    explain: "正確答案：<b>convenient (方便的)</b>。<br>句子中 safe and ___ (安全和...)，最常見的搭配就是方便 (convenient)。"
  },
  {
    text: "If you have any questions, simply scan the ___ using your phone's camera.",
    zh: "如果你有任何問題，只需用手機鏡頭掃描二維碼。",
    options: ["QR code", "graphics", "retina", "button"], 
    answer: 0,
    explain: "正確答案：<b>QR code (二維碼)</b>。<br>scan (掃描) + 手機鏡頭，最直接對應的就是二維碼。"
  },
  {
    text: "You will then be asked to download our app which will allow you to talk with our state-of-the-art ___.",
    zh: "然後你會被要求下載我們的應用程式，它允許你與我們最先進的聊天機器人交談。",
    options: ["drone", "processor", "chatbot", "smartwatch"], 
    answer: 2,
    explain: "正確答案：<b>chatbot (聊天機器人)</b>。<br>句子提到 talk with (與...交談)，所以是能對話的 AI，即 chatbot。"
  },
  {
    text: "This app can ___ 50 languages from voice to text.",
    zh: "這個應用程式可以將 50 種語言的語音翻譯成文字。",
    options: ["track", "translate", "interact", "hack"], 
    answer: 1,
    explain: "正確答案：<b>translate (翻譯)</b>。<br>把語言從 voice (語音) 轉成 text (文字)，這個動作就是翻譯。"
  },
  {
    text: "This app can translate 50 languages from voice to text in ___, making it an invaluable tool for tourists.",
    zh: "這個應用程式可以即時將 50 種語言的語音翻譯成文字，這使它成為遊客的無價工具。",
    options: ["offline", "slow motion", "the future", "real time"], 
    answer: 3,
    explain: "正確答案：<b>real time (即時)</b>。<br>in real time 是固定搭配，意思是「即時地」，沒有延遲。"
  },
  {
    text: "It does make mistakes sometimes, but it is fairly ___ overall.",
    zh: "它有時確實會出錯，但總體來說相當準確。",
    options: ["accurate", "waterproof", "portable", "autonomous"], 
    answer: 0,
    explain: "正確答案：<b>accurate (準確的)</b>。<br>句子前半句說「有時會出錯」，後半句用 but (但是) 轉折，所以總體還是「準確」的。"
  },
  {
    text: "In a major breakthrough, scientists have finally developed a real ___ which allows users to stand on it and float in mid-air.",
    zh: "在重大突破中，科學家終於開發出了一個真正的懸浮滑板，允許使用者站在上面並在半空中漂浮。",
    options: ["drone", "hoverboard", "smartwatch", "chatbot"], 
    answer: 1,
    explain: "正確答案：<b>hoverboard (懸浮滑板)</b>。<br>stand on it and float in mid-air (站在上面並在半空中漂浮) 正是 hoverboard 的特徵。"
  },
  {
    text: "However, they are not ___, so they cannot be used on water.",
    zh: "然而，它們不防水，所以不能在水上使用。",
    options: ["heavy", "expensive", "waterproof", "alive"], 
    answer: 2,
    explain: "正確答案：<b>waterproof (防水的)</b>。<br>句子提到 cannot be used on water (不能在水上使用)，因為它不防水。"
  },

  /* ---------- Q12-Q22: 30 秒 (Biotechnology & Devices) ---------- */
  {
    text: "This ___ which you wear on your wrist can track various important health data.",
    zh: "這款戴在手腕上的智能手錶可以追蹤各種重要的健康數據。",
    options: ["camera", "drone", "smartwatch", "processor"], 
    answer: 2,
    explain: "正確答案：<b>smartwatch (智能手錶)</b>。<br>wear on your wrist (戴在手腕上) 提示了是手錶，加上能追蹤健康數據，所以是智能手錶。"
  },
  {
    text: "This smartwatch can ___ various important health data, such as the wearer's heart rate and skin temperature.",
    zh: "這款智能手錶可以追蹤各種重要的健康數據，例如佩戴者的心率和皮膚溫度。",
    options: ["track", "translate", "download", "scan"], 
    answer: 0,
    explain: "正確答案：<b>track (追蹤)</b>。<br>手錶紀錄並監測健康數據的動詞通常用 track。"
  },
  {
    text: "It can track various important health data, such as the wearer's ___ and skin temperature.",
    zh: "它可以追蹤各種重要的健康數據，例如佩戴者的心率和皮膚溫度。",
    options: ["QR code", "payment method", "heart rate", "graphics card"], 
    answer: 2,
    explain: "正確答案：<b>heart rate (心率)</b>。<br>與 skin temperature (皮膚溫度) 並列的健康數據，當然是心率。"
  },
  {
    text: "The high-security bank vault uses a high-tech device which takes a ___ of a person's eye before unlocking for them.",
    zh: "高安全性的銀行金庫使用了一種高科技設備，在為人解鎖前會對人的眼睛進行視網膜掃描。",
    options: ["camera", "retinal scan", "fingerprint", "password"], 
    answer: 1,
    explain: "正確答案：<b>retinal scan (視網膜掃描)</b>。<br>句子提到 of a person's eye (人的眼睛)，所以是視網膜掃描。"
  },
  {
    text: "The ___ comes with a built-in camera which can be used to take photos and videos from the sky.",
    zh: "這款無人機配有內置鏡頭，可用於從空中拍攝照片和影片。",
    options: ["laptop", "smartphone", "hoverboard", "drone"], 
    answer: 3,
    explain: "正確答案：<b>drone (無人機)</b>。<br>from the sky (從天空中) 提示了會飛的設備，即無人機。"
  },
  {
    text: "The drone comes with a built-in ___ which can be used to take photos and videos from the sky.",
    zh: "這款無人機配有內置鏡頭，可用於從空中拍攝照片和影片。",
    options: ["screen", "camera", "battery", "button"], 
    answer: 1,
    explain: "正確答案：<b>camera (鏡頭/相機)</b>。<br>take photos and videos (拍照和錄影) 需要用到的設備是鏡頭。"
  },
  {
    text: "After entering your symptoms into the ___, it will list some possible diseases.",
    zh: "將你的症狀輸入健康應用程式後，它會列出一些可能的疾病。",
    options: ["chatbot", "health app", "drone", "video game"], 
    answer: 1,
    explain: "正確答案：<b>health app (健康應用程式)</b>。<br>輸入 symptoms (症狀) 並得到 diseases (疾病) 結果的，是健康應用程式。"
  },
  {
    text: "After entering your symptoms into the health app, it will list some possible ___ or ailments related to the given symptoms.",
    zh: "將你的症狀輸入健康應用程式後，它會列出一些與給定症狀相關的可能疾病或不適。",
    options: ["graphics", "diseases", "payment methods", "specifications"], 
    answer: 1,
    explain: "正確答案：<b>diseases (疾病)</b>。<br>與 ailments (小病/不適) 並列的詞是 diseases。"
  },
  {
    text: "Zack thought he might need to buy a new gaming computer as the ___ for the latest games were very demanding.",
    zh: "扎克認為他可能需要買一台新的遊戲電腦，因為最新遊戲的規格要求非常高。",
    options: ["specifications", "processors", "graphics", "prices"], 
    answer: 0,
    explain: "正確答案：<b>specifications (規格)</b>。<br>遊戲對電腦的要求稱為 specifications (規格)。"
  },
  {
    text: "He needed a new ___ card and a new processor.",
    zh: "他需要一張新的顯示卡和一個新的處理器。",
    options: ["memory", "graphics", "battery", "network"], 
    answer: 1,
    explain: "正確答案：<b>graphics (圖像/顯示)</b>。<br>graphics card 是固定搭配，意思是「顯示卡」。"
  },
  {
    text: "He needed a new graphics card and a new ___.",
    zh: "他需要一張新的顯示卡和一個新的處理器。",
    options: ["processor", "monitor", "keyboard", "mouse"], 
    answer: 0,
    explain: "正確答案：<b>processor (處理器)</b>。<br>與 graphics card (顯示卡) 並列的電腦核心硬件是處理器。"
  }
];

/* ============================================================
   彈性計時：前11題20秒，後11題30秒
   ============================================================ */
function getQuestionTimeLimit(index){
  if (index < 11) return 20;
  return 30;
}

/* ============================================================
   遊戲邏輯
   ============================================================ */
const LETTERS = ["A","B","C","D"];

let current = 0;
let score = 0;
let timerId = null;
let timeLeft = 0;
let currentTimeLimit = 20;
let answered = false;
let wrongQuestionsList = []; 

function startGame(){
  current = 0;
  score = 0;
  wrongQuestionsList = [];
  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("endScreen").classList.add("hidden");
  document.getElementById("gameScreen").classList.remove("hidden");
  showQuestion();
}

function showQuestion(){
  answered = false;
  const q = QUESTIONS[current];
  currentTimeLimit = getQuestionTimeLimit(current);

  document.getElementById("progress").textContent = `第 ${current+1} / ${QUESTIONS.length} 題`;
  document.getElementById("score").textContent = `得分：${score}`;
  document.getElementById("limitTag").textContent = `限時 ${currentTimeLimit} 秒`;

  document.getElementById("questionText").innerHTML = q.text;
  document.getElementById("translationText").innerHTML = q.zh;

  const box = document.getElementById("options");
  box.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.innerHTML = `<span class="letter">${LETTERS[i]}</span><span>${opt}</span>`;
    btn.onclick = () => choose(i);
    box.appendChild(btn);
  });

  const fb = document.getElementById("feedback");
  fb.classList.add("hidden");
  fb.className = "feedback hidden";
  document.getElementById("nextBtn").classList.add("hidden");

  startTimer();
}

function startTimer(){
  clearInterval(timerId);
  timeLeft = currentTimeLimit;
  renderTimer();
  timerId = setInterval(() => {
    timeLeft -= 0.1;
    if (timeLeft <= 0){
      timeLeft = 0;
      renderTimer();
      clearInterval(timerId);
      if (!answered) choose(-1); 
    } else {
      renderTimer();
    }
  }, 100);
}

function renderTimer(){
  const pct = (timeLeft / currentTimeLimit) * 100;
  const bar = document.getElementById("timerBar");
  bar.style.width = pct + "%";
  bar.style.background = timeLeft <= 6 ? "#000000" : "#333333";
  document.getElementById("timerText").textContent = Math.ceil(timeLeft) + "s";
}

function choose(idx){
  if (answered) return;
  answered = true;
  clearInterval(timerId);

  const q = QUESTIONS[current];
  const buttons = document.querySelectorAll("#options .option");

  buttons.forEach((btn, i) => {
    btn.disabled = true;
    btn.classList.add("disabled");
    if (i === q.answer) btn.classList.add("correct");
    if (i === idx && i !== q.answer) btn.classList.add("wrong");
  });

  const fb = document.getElementById("feedback");
  fb.classList.remove("hidden");

  if (idx === q.answer){
    score++;
    fb.className = "feedback fb-correct";
    fb.innerHTML = `
      <div class="fb-title">✓ 正確！</div>
      <div class="fb-body">${q.explain}</div>`;
  } else {
    const chosenText = idx >= 0 ? q.options[idx] : "（超時，沒有作答）";
    wrongQuestionsList.push({
      question: q.text,
      zh: q.zh,
      chosen: chosenText,
      correct: q.options[q.answer],
      explain: q.explain
    });

    fb.className = "feedback fb-wrong";
    fb.innerHTML = `
      <div class="fb-title">✗ 答錯咗</div>
      <div class="fb-body">
        <div class="ansrow">你揀咗：<b>${chosenText}</b>　→　正確答案：<b>${q.options[q.answer]}</b></div>
        ${q.explain}
      </div>`;
  }

  document.getElementById("score").textContent = `得分：${score}`;

  const nextBtn = document.getElementById("nextBtn");
  nextBtn.classList.remove("hidden");
  nextBtn.textContent = current === QUESTIONS.length - 1 ? "看結果 →" : "下一題 →";
  nextBtn.focus();
}

function nextQuestion(){
  current++;
  if (current >= QUESTIONS.length){
    showEnd();
  } else {
    showQuestion();
  }
}

function showEnd(){
  clearInterval(timerId);
  document.getElementById("gameScreen").classList.add("hidden");
  document.getElementById("endScreen").classList.remove("hidden");

  const pct = Math.round((score / QUESTIONS.length) * 100);
  document.getElementById("finalScore").textContent = `${score} / ${QUESTIONS.length}`;
  document.getElementById("finalPct").textContent = `${pct}%`;

  let msg = "";
  if (pct >= 90) msg = "太棒了！你已經完全掌握這些詞彙！🎉";
  else if (pct >= 70) msg = "做得很好！再溫習一下錯題，你一定能拿滿分。💪";
  else if (pct >= 50) msg = "不錯的努力！請重點重溫下面的錯題解釋，會有很大幫助。";
  else msg = "不要灰心！請仔細閱讀下面的錯題解釋，了解每個詞的意思，再試一次。";

  document.getElementById("finalMsg").innerHTML = msg;

  const summaryBox = document.getElementById("summaryNotes");
  const notesList = document.getElementById("notesList");

  if (wrongQuestionsList.length === 0) {
    summaryBox.classList.add("hidden");
  } else {
    summaryBox.classList.remove("hidden");
    let notesHTML = "";
    
    wrongQuestionsList.forEach((item, index) => {
      notesHTML += `
        <div class="note-item">
          <div style="margin-bottom:6px; color:#666; font-style:italic;">題目：${item.question}</div>
          <div style="margin-bottom:8px; color:#666; font-style:italic;">中文：${item.zh}</div>
          <div style="margin-bottom:8px; color:#000000; font-weight:800;">你答咗：${item.chosen} (正確答案：${item.correct})</div>
          <div style="color:#333; font-size:0.9rem; line-height:1.6;">${item.explain}</div>
        </div>
      `;
    });
    notesList.innerHTML = notesHTML;
  }
}

document.addEventListener("keydown", (e) => {
  if (document.getElementById("gameScreen").classList.contains("hidden")) return;

  const key = e.key.toUpperCase();
  const nextBtn = document.getElementById("nextBtn");

  if (key === "ENTER" && !nextBtn.classList.contains("hidden")){
    e.preventDefault();
    nextQuestion();
    return;
  }
  if (answered) return;

  let idx = -1;
  if ("ABCD".includes(key)) idx = "ABCD".indexOf(key);
  if ("1234".includes(key)) idx = "1234".indexOf(key);

  if (idx >= 0 && idx < 4){
    e.preventDefault();
    choose(idx);
  }
});
</script>
</body>
</html>
